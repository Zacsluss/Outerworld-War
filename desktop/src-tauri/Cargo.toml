[package]
name = "bw-desktop"
version = "0.1.0"
description = "Brood War Remake, wrapped in Tauri; the multiplayer relay (test/serve.js, unchanged) ships beside it as a sidecar (REVIEW-M17 task 28)"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }

# The Job Object that kills the relay when this process dies by any means, a crash included; 0.59 is
# already in the dependency tree through tauri, so it costs no extra download or compile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
